# Builds the firmware of each board and publishes a GitHub release when a vX.Y tag is pushed
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.5
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -B build build
          idf.py -B build-tdeck -DBOARD=BOARD_LILYGO_TDECK build

      - name: Merge the images
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          mkdir dist
          (cd build && python -m esptool --chip esp32s3 merge_bin -o ../dist/quake2-wio-tracker-l2.bin @flash_args)
          (cd build-tdeck && python -m esptool --chip esp32s3 merge_bin -o ../dist/quake2-t-deck.bin @flash_args)

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.bin
          generate_release_notes: true
          body: |
            Firmware images, to flash at 0x0:

            ```
            esptool.py --chip esp32s3 write_flash 0x0 quake2-wio-tracker-l2.bin
            ```

            - `quake2-wio-tracker-l2.bin`: Seeed Wio Tracker L2
            - `quake2-t-deck.bin`: LilyGO T-Deck

            Copy `pak0.pak`, `pak1.pak` and `pak2.pak` of the retail Quake II to `baseq2/` on the
            SD card. On the first start the board copies the models and skins to its flash
            (about 2 minutes).
